<input class="w-full h-11 pl-11 pr-4 bg-surface-container-lowest rounded-lg font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/70 shadow-sm focus:outline-none focus:bg-surface-container-lowest" id="usernameInput" placeholder="Usuario" required="" type="text"/>
</div>
</div>
<!-- Input: Contraseña -->
<div class="flex flex-col gap-1">
<div class="relative flex items-center bg-surface-container-lowest rounded-lg transition-colors focus-within:bg-surface-container-lowest group">

<button class="absolute right-3.5 text-on-surface-variant hover:text-primary transition-colors flex items-center" id="togglePassword" tabindex="-1" title="Mostrar u ocultar contraseña" type="button">

<!-- Secondary Controls: Remember Me & Game Realm / Mode selector -->

<input checked="" class="w-4 h-4 rounded text-primary focus:ring-0 cursor-pointer accent-primary" id="rememberMe" type="checkbox"/>
<span class="group-hover:text-on-surface transition-colors">Recordar credenciales</span>
</label>

<!-- Notification Toast Modal (Discreet WinForms Alert) -->
<div class="fixed bottom-12 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none bg-surface-container-highest px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2" id="statusToast">
<span class="material-symbols-outlined text-primary text-[18px]">verified</span>
<span class="font-body-md text-body-md text-on-surface" id="statusToastMsg">Conectando a la flota...</span>
</div>
</div>
<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('passwordInput');
  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      const icon = toggleBtn.querySelector('span');
      if (icon) {
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      }
    });
  }

  // Visual simulation for login submit
  function handleLogin() {
    const userInput = document.getElementById('usernameInput');
    const toast = document.getElementById('statusToast');
    const toastMsg = document.getElementById('statusToastMsg');
    const submitBtn = document.getElementById('submitBtn');

    if (!userInput || !toast || !toastMsg || !submitBtn) return;

    const user = userInput.value.trim() || 'Comandante';
    toastMsg.textContent = `¡Bienvenido(a), Almirante ${user}! Iniciando partida...`;
    
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-80');
    
    // Show toast
    toast.classList.remove('translate-y-24', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-24', 'opacity-0');
      submitBtn.disabled = false;
      submitBtn.classList.remove('opacity-80');
    }, 2800);
  }
</script></main><footer class="w-full py-space-sm bg-surface-container-high/60 text-center font-label-md text-label-md text-on-surface-variant">© Batalla Naval Desktop Software • Sistema de Autenticación</footer></body></html>
